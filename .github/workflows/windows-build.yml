name: Windows Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore AccountingSystem.sln

    - name: Build and Publish
      run: dotnet publish src/AccountingSystem.Desktop/AccountingSystem.Desktop.csproj -c Release -o ./publish -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true /p:IncludeNativeLibrariesForSelfExtract=true

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: AccountingSystem-Windows
        path: ./publish/*.exe
